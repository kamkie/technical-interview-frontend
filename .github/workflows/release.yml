name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-image:
    name: Publish container image
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    outputs:
      image_repository: ${{ steps.image.outputs.repository }}
      image_tag: ${{ steps.image.outputs.tag }}
      image_sha_tag: ${{ steps.image.outputs.sha_tag }}
      image_digest: ${{ steps.digest.outputs.digest }}
      image_reference: ${{ steps.digest.outputs.reference }}
      package_page: ${{ steps.image.outputs.package_page }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: npm

      - name: Setup npm
        shell: bash
        run: |
          package_manager=$(node -p "require('./package.json').packageManager")
          npm install -g "${package_manager}"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Audit security
        run: npm run audit:security

      - name: Verify Docker availability
        run: docker version

      - name: Resolve image coordinates
        id: image
        shell: bash
        run: |
          image_repository=$(echo "ghcr.io/${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')
          package_name=$(basename "${image_repository}")
          package_page="https://github.com/${GITHUB_REPOSITORY}/pkgs/container/${package_name}"
          image_tag="${GITHUB_REF_NAME}"
          image_sha_tag="sha-${GITHUB_SHA::12}"
          {
            echo "repository=${image_repository}"
            echo "package_page=${package_page}"
            echo "tag=${image_tag}"
            echo "sha_tag=${image_sha_tag}"
          } >> "${GITHUB_OUTPUT}"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build release image
        run: |
          docker build --pull \
            -t "${{ steps.image.outputs.repository }}:${{ steps.image.outputs.tag }}" \
            -t "${{ steps.image.outputs.repository }}:${{ steps.image.outputs.sha_tag }}" \
            .

      - name: Smoke test release image
        shell: bash
        run: |
          container_id=""
          cleanup() {
            if [ -n "${container_id}" ]; then
              docker logs "${container_id}" || true
              docker rm -f "${container_id}" || true
            fi
          }
          trap cleanup EXIT

          container_id=$(docker run -d \
            -p 8080:8080 \
            -e FRONTEND_API_UPSTREAM=http://127.0.0.1:9 \
            "${{ steps.image.outputs.repository }}:${{ steps.image.outputs.tag }}")

          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:8080/healthz >/dev/null; then
              break
            fi
            sleep 1
          done

          curl -fsS http://127.0.0.1:8080/ >/tmp/frontend-index.html
          test -s /tmp/frontend-index.html

      - name: Publish container image tags
        run: |
          docker push "${{ steps.image.outputs.repository }}:${{ steps.image.outputs.tag }}"
          docker push "${{ steps.image.outputs.repository }}:${{ steps.image.outputs.sha_tag }}"

      - name: Resolve pushed image digest
        id: digest
        shell: bash
        run: |
          image_repository="${{ steps.image.outputs.repository }}"
          image_tag="${{ steps.image.outputs.tag }}"
          image_sha_tag="${{ steps.image.outputs.sha_tag }}"

          tag_digest=$(docker buildx imagetools inspect "${image_repository}:${image_tag}" --format '{{.Manifest.Digest}}')
          sha_digest=$(docker buildx imagetools inspect "${image_repository}:${image_sha_tag}" --format '{{.Manifest.Digest}}')

          if [ -z "${tag_digest}" ] || [ -z "${sha_digest}" ]; then
            echo "Failed to resolve a pushed GHCR digest for one or both release tags."
            exit 1
          fi

          if [ "${tag_digest}" != "${sha_digest}" ]; then
            echo "Release tags resolved to different digests."
            echo "${image_repository}:${image_tag} -> ${tag_digest}"
            echo "${image_repository}:${image_sha_tag} -> ${sha_digest}"
            exit 1
          fi

          {
            echo "digest=${tag_digest}"
            echo "reference=${image_repository}@${tag_digest}"
          } >> "${GITHUB_OUTPUT}"

      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.2
        with:
          cosign-release: v3.0.5

      - name: Sign pushed image digest
        run: cosign sign --yes "${{ steps.digest.outputs.reference }}"

      - name: Verify pushed image signature
        shell: bash
        run: |
          cosign verify \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/tags/${GITHUB_REF_NAME}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${{ steps.digest.outputs.reference }}"

      - name: Publish provenance attestation
        uses: actions/attest-build-provenance@v4
        with:
          push-to-registry: true
          subject-name: ${{ steps.image.outputs.repository }}
          subject-digest: ${{ steps.digest.outputs.digest }}

      - name: Summarize release identity handoff
        shell: bash
        run: |
          {
            echo "## Release Identity Handoff"
            echo ""
            echo "- Semantic image: \`${{ steps.image.outputs.repository }}:${{ steps.image.outputs.tag }}\`"
            echo "- Immutable image: \`${{ steps.image.outputs.repository }}:${{ steps.image.outputs.sha_tag }}\`"
            echo "- Immutable digest: \`${{ steps.digest.outputs.reference }}\`"
            echo "- Package page: ${{ steps.image.outputs.package_page }}"
            echo "- Cosign verification line: \`v3.0.5\`"
            echo "- Cosign certificate identity: \`https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/tags/${GITHUB_REF_NAME}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: publish-image
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect prerelease tag
        id: release-kind
        shell: bash
        run: |
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            echo "is_prerelease=true" >> "${GITHUB_OUTPUT}"
          else
            echo "is_prerelease=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Resolve previous published GitHub Release
        id: previous-release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $currentTag = "${{ github.ref_name }}"
          $publishedReleases = @(
            gh release list `
              --exclude-drafts `
              --exclude-pre-releases `
              --limit 100 `
              --json tagName,publishedAt | ConvertFrom-Json
          )

          $previousRelease = @(
            $publishedReleases |
              Where-Object { $_.tagName -ne $currentTag } |
              Sort-Object { [DateTimeOffset]$_.publishedAt } -Descending
          ) | Select-Object -First 1

          if ($previousRelease) {
            "previous_tag=$($previousRelease.tagName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          } else {
            "previous_tag=" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          }

      - name: Render release notes from CHANGELOG.md
        shell: pwsh
        run: |
          ./scripts/release/render-release-notes.ps1 `
            -ChangelogPath CHANGELOG.md `
            -CurrentTag "${{ github.ref_name }}" `
            -PreviousPublishedTag "${{ steps.previous-release.outputs.previous_tag }}" `
            -TagImageReference "${{ needs.publish-image.outputs.image_repository }}:${{ needs.publish-image.outputs.image_tag }}" `
            -ShaImageReference "${{ needs.publish-image.outputs.image_repository }}:${{ needs.publish-image.outputs.image_sha_tag }}" `
            -PackagePageUrl "${{ needs.publish-image.outputs.package_page }}" `
            -OutputPath release-notes.md

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease_flag=()
          if [[ "${{ steps.release-kind.outputs.is_prerelease }}" == "true" ]]; then
            prerelease_flag+=(--prerelease)
          fi

          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --notes-file release-notes.md \
            "${prerelease_flag[@]}"
