name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}"
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validation:
    name: Validate
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: 24.x
          cache: npm

      - name: Setup npm
        shell: bash
        run: |
          package_manager=$(node -p "require('./package.json').packageManager")
          npm install -g "${package_manager}"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: >-
          npm test --
          --reporter=default
          --reporter=junit
          --outputFile.junit=../test-results/vitest.junit.xml

      - name: Upload test report artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: frontend-test-results
          path: test-results/vitest.junit.xml
          if-no-files-found: warn
          retention-days: 14

      - name: Publish test report
        if: ${{ !cancelled() }}
        uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # v3
        with:
          name: Vitest Tests
          path: test-results/vitest.junit.xml
          reporter: java-junit
          fail-on-error: true
          fail-on-empty: false

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          disable_search: true
          fail_ci_if_error: true
          files: ./test-results/vitest.junit.xml
          flags: frontend
          name: frontend-tests
          report_type: test_results
          use_oidc: true

      - name: Test coverage
        run: npm run test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          disable_search: true
          fail_ci_if_error: true
          files: ./coverage/lcov.info
          flags: frontend
          name: frontend
          use_oidc: true

      - name: Build
        run: npm run build

      - name: Bundle budget
        run: npm run hardening:bundle-budget

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Accessibility
        run: npm run a11y

      - name: Audit security
        run: npm run audit:security

      - name: Runtime hardening
        run: npm run hardening:runtime

      - name: Check whitespace
        run: git diff --check
