name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}"
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validation:
    name: Validate
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24.x
          cache: npm

      - name: Setup npm
        shell: bash
        run: |
          package_manager=$(node -p "require('./package.json').packageManager")
          npm install -g "${package_manager}"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: >-
          npm test --
          --reporter=default
          --reporter=junit
          --outputFile.junit=../test-results/vitest.junit.xml

      - name: Upload test report artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: frontend-test-results
          path: test-results/vitest.junit.xml
          if-no-files-found: warn
          retention-days: 14

      - name: Publish test report
        if: ${{ !cancelled() }}
        uses: dorny/test-reporter@1cc81a5edf733718d4850df304aaa21c05cd7280 # v3
        with:
          name: Vitest Tests
          path: test-results/vitest.junit.xml
          reporter: java-junit
          fail-on-error: true
          fail-on-empty: false

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@a99c28d3f0da835de33ff2feb2e15691c7b9641f # v7
        with:
          disable_search: true
          fail_ci_if_error: true
          files: ./test-results/vitest.junit.xml
          flags: frontend
          name: frontend-tests
          report_type: test_results
          use_oidc: true

      - name: Test coverage
        run: npm run test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@a99c28d3f0da835de33ff2feb2e15691c7b9641f # v7
        with:
          disable_search: true
          fail_ci_if_error: true
          files: ./coverage/lcov.info
          flags: frontend
          name: frontend
          use_oidc: true

      - name: Build
        run: npm run build

      - name: Bundle budget
        run: npm run hardening:bundle-budget

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Accessibility
        run: npm run a11y

      - name: Audit security
        run: npm run audit:security

      - name: Runtime hardening
        run: npm run hardening:runtime

      - name: Check whitespace
        run: git diff --check
