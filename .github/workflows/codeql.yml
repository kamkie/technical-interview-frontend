name: CodeQL

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "37 5 * * 1"

permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  group: "${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}"
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        language:
          - javascript-typescript
          - actions

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}

      - name: Perform CodeQL analysis
        id: analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
          upload: never
          post-processed-sarif-path: codeql-sarif

      - name: Upload CodeQL SARIF artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codeql-${{ matrix.language }}-sarif
          path: codeql-sarif
          if-no-files-found: warn

      - name: Report CodeQL artifact mode
        if: ${{ github.event.repository.private }}
        run: |
          echo "::notice title=CodeQL artifact mode::This private repository writes CodeQL SARIF artifacts instead of uploading to code scanning. Enable GitHub code scanning/GitHub Advanced Security and switch CodeQL upload back to always when maintainers want Security-tab alerts."
