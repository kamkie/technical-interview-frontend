name: Dependency Review

on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: "${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}"
  cancel-in-progress: true

jobs:
  dependency-review:
    name: Review dependencies
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Dependency review
        id: dependency-review
        uses: actions/dependency-review-action@v5
        continue-on-error: ${{ github.event.repository.private }}
        with:
          fail-on-severity: high
          warn-only: ${{ github.event.repository.private }}

      - name: Report private-repository advisory mode
        if: ${{ github.event.repository.private }}
        env:
          DEPENDENCY_REVIEW_OUTCOME: ${{ steps.dependency-review.outcome }}
        run: |
          if [ "$DEPENDENCY_REVIEW_OUTCOME" = "failure" ]; then
            echo "::warning title=Dependency Review needs GitHub security features::Enable Dependency graph and GitHub Advanced Security support for this private repository to make dependency-review enforceable. The workflow stays green here; use npm audit output until those features are enabled."
          else
            echo "::notice title=Dependency Review advisory mode::This private repository runs dependency-review in warn-only mode. Enable Dependency graph and GitHub Advanced Security support, then remove advisory mode when maintainers want this check to block high-or-critical dependency changes."
          fi
