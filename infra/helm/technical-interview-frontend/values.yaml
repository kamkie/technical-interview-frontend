replicaCount: 2

image:
  repository: ghcr.io/example/technical-interview-frontend
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

config:
  apiUpstream: "http://technical-interview-demo.technical-interview-demo.svc.cluster.local:80"

probes:
  startup:
    path: /healthz
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 12
  readiness:
    path: /healthz
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  liveness:
    path: /healthz
    initialDelaySeconds: 20
    periodSeconds: 20
    timeoutSeconds: 3
    failureThreshold: 3

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 128Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

podDisruptionBudget:
  enabled: true
  minAvailable: 1

pod:
  terminationGracePeriodSeconds: 30
  securityContext:
    runAsNonRoot: true
    fsGroup: 101
    seccompProfile:
      type: RuntimeDefault

container:
  securityContext:
    runAsUser: 101
    runAsGroup: 101
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
  mounts:
    nginxConf: /etc/nginx/conf.d
    nginxCache: /var/cache/nginx
    nginxRun: /var/run
    tmp: /tmp
