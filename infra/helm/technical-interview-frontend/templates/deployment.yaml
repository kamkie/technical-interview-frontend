apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "technical-interview-frontend.fullname" . }}
  labels:
    {{- include "technical-interview-frontend.labels" . | nindent 4 }}
spec:
  replicas: {{ ternary .Values.autoscaling.minReplicas .Values.replicaCount .Values.autoscaling.enabled }}
  selector:
    matchLabels:
      {{- include "technical-interview-frontend.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "technical-interview-frontend.selectorLabels" . | nindent 8 }}
    spec:
      securityContext:
        {{- toYaml .Values.pod.securityContext | nindent 8 }}
      terminationGracePeriodSeconds: {{ .Values.pod.terminationGracePeriodSeconds }}
      containers:
        - name: technical-interview-frontend
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.container.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
          env:
            - name: FRONTEND_API_UPSTREAM
              valueFrom:
                configMapKeyRef:
                  name: {{ include "technical-interview-frontend.fullname" . }}-config
                  key: FRONTEND_API_UPSTREAM
          volumeMounts:
            - name: nginx-conf
              mountPath: {{ .Values.container.mounts.nginxConf }}
            - name: nginx-cache
              mountPath: {{ .Values.container.mounts.nginxCache }}
            - name: nginx-run
              mountPath: {{ .Values.container.mounts.nginxRun }}
            - name: tmp
              mountPath: {{ .Values.container.mounts.tmp }}
          startupProbe:
            httpGet:
              path: {{ .Values.probes.startup.path }}
              port: http
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.startup.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: nginx-conf
          emptyDir: {}
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
